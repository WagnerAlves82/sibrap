='#516278' stroke-width='1.5'/><text x='550' y='214.0' font-size='12' fill='#516278' text-anchor='end' font-weight='normal'>≈ 3 m.c.a.</text><line x1='20' y1='400' x2='740' y2='400' stroke='#14213A' stroke-width='2'/><text x='380' y='428' font-size='12' fill='#516278' text-anchor='middle' font-weight='normal'>Cada metro entre o nível da água e o ponto ≈ 1 m.c.a. de pressão (parada). Curvas e tubos longos tiram um pouco no caminho.</text></svg>