<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 700 330' width='700' height='330' font-family='Arial, Helvetica, sans-serif'><rect width='700' height='330' fill='#FFFFFF'/><circle cx='200' cy='170' r='140' fill='#ECEFF1' stroke='#14213A' stroke-width='4'/><circle cx='200' cy='170' r='118' fill='#fff' stroke='#516278' stroke-width='2'/><rect x='110' y='110' width='180' height='40' fill='#0B2A4A'/><text x='124' y='138' font-size='22' fill='#fff' text-anchor='middle' font-weight='bold'>0</text><text x='148' y='138' font-size='22' fill='#fff' text-anchor='middle' font-weight='bold'>1</text><text x='172' y='138' font-size='22' fill='#fff' text-anchor='middle' font-weight='bold'>2</text><text x='196' y='138' font-size='22' fill='#fff' text-anchor='middle' font-weight='bold'>3</text><text x='220' y='138' font-size='22' fill='#fff' text-anchor='middle' font-weight='bold'>4</text><rect x='232' y='110' width='58' height='40' fill='#C62828'/><text x='240' y='138' font-size='18' fill='#fff' text-anchor='middle' font-weight='bold'>5</text><text x='258' y='138' font-size='18' fill='#fff' text-anchor='middle' font-weight='bold'>6</text><text x='276' y='138' font-size='18' fill='#fff' text-anchor='middle' font-weight='bold'>0</text><text x='200' y='168' font-size='14' fill='#14213A' text-anchor='middle' font-weight='bold'>m³</text><circle cx='200' cy='225' r='26' fill='#fff' stroke='#14213A' stroke-width='2'/><polygon points='200,203 207,225 200,247 193,225' fill='#E0A800' stroke='#14213A'/><text x='420' y='120' font-size='13' fill='#14213A' text-anchor='start' font-weight='bold'>Pretos: metros cúbicos (m³)</text><text x='420' y='140' font-size='12' fill='#516278' text-anchor='start' font-weight='normal'>1 m³ = 1.000 litros</text><text x='420' y='175' font-size='13' fill='#C62828' text-anchor='start' font-weight='bold'>Vermelhos: frações do m³</text><text x='420' y='195' font-size='12' fill='#516278' text-anchor='start' font-weight='normal'>Ex.: 01234,560 m³</text><text x='420' y='230' font-size='13' fill='#14213A' text-anchor='start' font-weight='bold'>Indicador que gira: qualquer</text><text x='420' y='250' font-size='12' fill='#516278' text-anchor='start' font-weight='normal'>passagem de água. Com tudo</text><text x='420' y='268' font-size='12' fill='#516278' text-anchor='start' font-weight='normal'>fechado, girando = vazamento.</text></svg>