<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 720 290' width='720' height='290' font-family='Arial, Helvetica, sans-serif'><rect width='720' height='290' fill='#FFFFFF'/><polyline points='30,50 200,50' fill='none' stroke='#D32F2F' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/><text x='220' y='46' font-size='15' fill='#14213A' text-anchor='start' font-weight='bold'>Fase</text><text x='220' y='65' font-size='12' fill='#516278' text-anchor='start' font-weight='normal'>qualquer cor, exceto azul-claro e verde-amarelo (comum: preto, vermelho, marrom)</text><polyline points='30,112 200,112' fill='none' stroke='#3FA9F5' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/><text x='220' y='108' font-size='15' fill='#14213A' text-anchor='start' font-weight='bold'>Neutro</text><text x='220' y='127' font-size='12' fill='#516278' text-anchor='start' font-weight='normal'>azul-claro (reservado)</text><polyline points='30,174 200,174' fill='none' stroke='#E0A800' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/><text x='220' y='170' font-size='15' fill='#14213A' text-anchor='start' font-weight='bold'>Retorno</text><text x='220' y='189' font-size='12' fill='#516278' text-anchor='start' font-weight='normal'>cor diferente da fase, combinada na obra (neste curso: amarelo)</text><polyline points='30,236 200,236' fill='none' stroke='#2E7D32' stroke-width='14' stroke-linecap='round' stroke-linejoin='round'/><polyline points='30,236 200,236' fill='none' stroke='#F2C200' stroke-width='14' stroke-dasharray='7 7' stroke-linejoin='round'/><text x='220' y='232' font-size='15' fill='#14213A' text-anchor='start' font-weight='bold'>Proteção (PE)</text><text x='220' y='251' font-size='12' fill='#516278' text-anchor='start' font-weight='normal'>verde-amarelo ou verde (reservado)</text></svg>