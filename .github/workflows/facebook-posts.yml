# Divulga no Facebook as matérias e apostilas mais recentes, até 6 por dia, TODAS DE MANHÃ.
# Cada execução publica no máximo 1 item; o site respeita o teto diário (FACEBOOK_MAX_POR_DIA, padrão 6).
# Rajada às 07:00-07:35 (Brasília), de 5 em 5 minutos: são 8 disparos para 6 posts porque o GitHub atrasa ou pula
# execuções, e quando um é pulado o seguinte cobre. Sem posts espalhados em manhã, tarde e noite.
#
# Configuração (Settings > Secrets and variables > Actions):
#   secret SOCIAL_SECRET   mesmo valor de SOCIAL_SECRET na Vercel (32+ caracteres)
# Na Vercel: SOCIAL_SECRET, FACEBOOK_PAGE_ID, FACEBOOK_PAGE_TOKEN.
name: Facebook posts

on:
  schedule:
    - cron: "0 10 * * *"
    - cron: "5 10 * * *"
    - cron: "10 10 * * *"
    - cron: "15 10 * * *"
    - cron: "20 10 * * *"
    - cron: "25 10 * * *"
    - cron: "30 10 * * *"
    - cron: "35 10 * * *"
  workflow_dispatch:
    inputs:
      dry:
        description: "Só mostrar o que seria publicado (1) ou publicar de verdade (0)"
        default: "1"

permissions:
  contents: read

concurrency:
  group: facebook-posts
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Chamar o site
        env:
          SOCIAL_SECRET: ${{ secrets.SOCIAL_SECRET }}
          DRY: ${{ github.event.inputs.dry || '0' }}
        run: |
          set -eu
          if [ -z "${SOCIAL_SECRET}" ]; then
            echo "::error::Configure o secret SOCIAL_SECRET."
            exit 1
          fi
          status=$(curl -sS --max-time 50 -o resposta.json -w "%{http_code}" \
            -X POST "https://www.sibrap.tec.br/api/social/facebook?dry=${DRY}" \
            -H "Authorization: Bearer ${SOCIAL_SECRET}")
          echo "HTTP ${status}"
          cat resposta.json
          echo
          [ "${status}" = "200" ]
